spring:
  application:
    name: shop-service # 服务名称
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: ${nacos.server-addr:127.0.0.1:8848} # 本地默认，部署时填实际 Nacos 地址
      config:
        file-extension: yaml # 文件后缀名
        # 服务自身配置 shop-service.yaml 读取 HMDP_CLOUD 分组
        group: HMDP_CLOUD
        shared-configs: # 共享配置逐条指定分组+动态刷新
          - dataId: shared-jdbc.yaml
            group: HMDP_CLOUD
            refresh: true
          - dataId: shared-log.yaml
            group: HMDP_CLOUD
            refresh: true
          - dataId: shared-redis.yaml
            group: HMDP_CLOUD
            refresh: true
          - dataId: shared-canal.yaml
            group: HMDP_CLOUD
            refresh: true
          - dataId: shared-rabbitmq.yaml
            group: HMDP_CLOUD
            refresh: true
          - dataId: shared-sentinel.yaml
            group: HMDP_CLOUD
            refresh: true
          # 补订阅：原先漏了这一条，导致 shop-service 声明了 hmdp.swagger.* 却没有集中 swagger 配置
          - dataId: shared-swagger.yaml
            group: HMDP_CLOUD
            refresh: true
# 说明：1) 不需要 shared-seata.yaml —— shop-service 的 pom 未引入 spring-cloud-starter-alibaba-seata，也不参与分布式事务。
# 2) 需要 shared-canal.yaml —— 店铺分类(tb_shop_type)与 outbox 都靠 Canal 推送。