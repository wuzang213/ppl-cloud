server:
  port: 8085
  tomcat:
    threads:
      max: 100
    accept-count: 100
    max-connections: 200
spring:
  kafka:
    # search-service 本身不消费 Kafka（浏览量那套是 blog/shop 的事），
    # 但 common 里带了 spring-kafka 依赖，Boot 会自动装配 KafkaTemplate，
    # 显式给个地址避免它去连 localhost:9092 刷一堆连接失败日志。
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092} # 部署时填实际 Kafka 地址
  rabbitmq:
    listener:
      simple:
        # ⚠️ 必须为 false：搜索索引队列不许 requeue —— 队列的 DLX 参数只在消息被 reject 时才生效，
        # 而 requeue=true 会把"反序列化就失败"这类坏消息无限重投、CPU 直接打满（同 KNOWN_ISSUES.md P1-8）。
        # 业务异常另由 SearchIndexListener 自己捕获 → 落 search_index_failed 表 → 显式投死信，不依赖容器 requeue 策略。
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null
hmdp:
  db:
    # 独立库：只需 outbox_consume_record + search_rebuild_task + search_index_failed 三张表
    # （search-service 不写 business_outbox —— 它没有业务写操作）
    database: hmdp_search
  outbox:
    reconcile:
      # ⚠️ 必须 false：common 的 OutboxReconcileTask 会在每个引入 common 的服务里生效，
      # 它无条件读写 business_outbox，而本服务按设计没有这张表，不关掉它会每 60 秒抛一次
      # BadSqlGrammarException（Table 'hmdp_search.business_outbox' doesn't exist）刷满 ERROR 日志。
      enabled: false
  swagger:
    title: 站内搜索服务接口文档
    package: com.hmdp.search.controller
  search:
    # ES 单节点部署。⚠️ 版本必须是 7.12.1（与客户端、IK 插件三方对齐）
    host: ${ES_HOST:127.0.0.1} # 部署时填实际 ES 地址
    port: ${ES_PORT:9200}
    # 启动自检 + 首次全量初始化（别名不存在或文档数为 0 时自动重建）
    auto-rebuild-on-startup: true
    # IK 分词；置 false 会把 mapping 降级成 standard（中文退化为单字切分），仅作应急
    use-ik: true
    # 全量重建分页/批量参数
    rebuild-page-size: 200
    bulk-size: 500
    # 重建互斥锁租约（分钟）
    rebuild-lock-minutes: 30
    # 失败重试：退避 30s×(n+1)，超过 5 次转终态失败（与 outbox MAX_RETRY 口径一致）
    failed-retry-max: 5
    retry-interval-millis: 60000
    # 冗余字段（作者名/分类名）刷新的防抖合并窗口
    debounce-millis: 5000
    # 查询护栏：size 上限 50、from+size 上限 1000
    max-page-size: 50
    max-window: 1000
feign:
  okhttp:
    enabled: true # 开启okhttp
  sentinel:
    enabled: true # 开启feign对sentinel的支持
