# search-service 的 Elasticsearch 连接（hmdp.search.*，由 SearchProperties 读取）
# ⚠️ 本地 application.yaml 里也写了同名键，且按 Spring Cloud 加载顺序本地优先级更高；
#    本文件作为 Nacos 侧的兜底占位，改 ES 地址优先用环境变量 ES_HOST / ES_PORT。
hmdp:
  search:
    host: ${ES_HOST:127.0.0.1} # 你的 Elasticsearch 地址
    port: ${ES_PORT:9200} # 你的 Elasticsearch 端口
